corpus_id: substation_reference
corpus_version: "2.0"
description: >-
  Reference annotations for the deterministic engineering evidence
  rules. Written by reading the document text, not by recording what
  the extractor produced - a corpus derived from the extractor could
  never find a fault in it.

  Version 2.0 (EPIC 32.E2) adds three documents whose lines are
  transcribed verbatim from a single Italian DSO's HV/MV functional
  diagrams, each carrying the drawing's document code, page and file
  checksum. Documents carrying a `source:` block are REAL evidence;
  the others were authored to exercise a rule, and the two are kept
  distinguishable so a metric cannot quietly measure the extractor
  against itself.
annotated_against_policy_version: "2.0"
annotated_rule_versions:
  designation_generic: "2.0"
  voltage_value: "1.0"
  current_value: "1.0"
  power_value: "1.0"
  cable_section_value: "1.0"
  location_aspect_iec_81346: "2.0"
