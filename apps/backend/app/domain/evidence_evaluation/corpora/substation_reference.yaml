  - document_ref: real_gas_alarm_prose
    title: Gas alarm sheet titles - SF6 false-positive probe (LINEA AT, real source)
    source:
      document_code: "REF-A-S-025_01 LINEA AT SCHEMA FUNZIONALE"
      page_number: 3
      source_ref_digest: "bd313cef1e8b9b5124a488f20f612cb3f241a26202cb2c7cd095edbcb1b62f0b"
      note: >-
        Transcribed verbatim. SF6 is sulphur hexafluoride, the insulating gas,
        and is NOT annotated as a designation because it is not one. The
        extractor observes it anyway: it is shaped exactly like the real
        designations MI1, MO2 and Q8 in the same drawings, so no grammar
        separates them, and on review neither a token catalogue nor a two-word
        context rule was defensible. These lines therefore MEASURE a known
        false positive instead of hiding it. P1 and P4 on the same lines ARE
        designations and are annotated as such.

        Migrated from the CP Beta drawing to CP Alfa by EPIC 32.E4: the
        same sheet-index wording occurs in both, so the probe survives the
        corpus replacement unchanged in intent.
    lines:
      - "INTERRUTTORE AT – BASSA PRESSIONE SF6 (P1 GAS)"
      - "INTERRUTTORE AT – BASSA PRESSIONE SF6 (P4 GAS)"
      - "TA AT – ALLARMI SF6 TA (63GTAAL)"
