      note: >-
        Transcribed verbatim from the sheet index of the CP Alfa HV-line
        functional diagram. Dot-qualified product designations - the family
        EPIC 32.E2 made atomic - each written beside its mounting reference.

        The `+189L`, `+189SB`, `+189SS` and `+CASS_TV` tokens on these lines
        are deliberately NOT annotated. EPIC 32.E4 measured that the governed
        location-aspect rule recognises only letter-leading forms, so these
        digit-leading and underscore forms are not observed at all. Annotating
        them would assert a location vocabulary no one has reviewed; the gap is
        recorded as an E4 finding for a future extraction milestone instead.
