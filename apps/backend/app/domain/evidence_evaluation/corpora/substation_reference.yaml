corpus_id: substation_reference
corpus_version: "3.1"
description: >-
  Reference annotations for the deterministic engineering evidence
  rules. Written by reading the document text, not by recording what
  the extractor produced - a corpus derived from the extractor could
  never find a fault in it.

  Version 2.0 (EPIC 32.E2) added three documents whose lines are
  transcribed verbatim from a single Italian DSO's HV/MV functional
  diagrams, each carrying the drawing's document code, page and file
  checksum. Documents carrying a `source:` block are REAL evidence;
  the others were authored to exercise a rule, and the two are kept
  distinguishable so a metric cannot quietly measure the extractor
  against itself.

  Version 3.0 (EPIC 32.E4) makes every real source one installation:
  **CP Alfa 150/20 kV**, a primary substation of a single Italian DSO.
  The CP Beta drawing the HV-line and gas-alarm samples came from was
  retired with that milestone; the transformer sample was already Alfa
  and is unchanged. A corpus drawn from one plant is what lets a
  cross-document question be asked at all.

  Version 3.1 (EPIC 33.R1) pseudonymises the source metadata for public
  release - see ADR-0033. Installation and drawing identities are stable
  handles resolved through a private map; the drawings themselves are
  external inputs and were never in this repository. **No transcribed
  line and no annotation changed**, so what "correct" means is exactly
  what it was under 3.0 and the measured baseline is unmoved.
annotated_against_policy_version: "2.0"
annotated_rule_versions:
  designation_generic: "2.0"
  voltage_value: "1.0"
  current_value: "1.0"
  power_value: "1.0"
  cable_section_value: "1.0"
  location_aspect_iec_81346: "2.0"
